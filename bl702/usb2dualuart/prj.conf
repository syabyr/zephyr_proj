# USB device stack (next generation) on top of the BL702 UDC driver.
CONFIG_USB_DEVICE_STACK_NEXT=y

# UART / GPIO used by the bridge.
CONFIG_SERIAL=y
CONFIG_UART_INTERRUPT_DRIVEN=y
CONFIG_UART_USE_RUNTIME_CONFIGURE=y
CONFIG_GPIO=y

# UART0 is FTDI channel A.  Never let the console share it, otherwise
# every printk byte ends up on the bridged serial line.
CONFIG_CONSOLE=n
CONFIG_UART_CONSOLE=n

CONFIG_LOG=n

CONFIG_MAIN_STACK_SIZE=2048
CONFIG_SYSTEM_WORKQUEUE_STACK_SIZE=2048
