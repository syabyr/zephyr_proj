CONFIG_NETWORKING=y
CONFIG_IEEE802154=y

# The BL702 RF glue reads the factory MAC address through hwinfo.
CONFIG_HWINFO=y

# The BOOT key (D28) steps the channel.
CONFIG_GPIO=y

# No MAC stack: the driver hands every received frame to net_recv_data().
CONFIG_IEEE802154_RAW_MODE=y
CONFIG_IEEE802154_BFLB=y
CONFIG_IEEE802154_L2_PKT_INCL_FCS=n

CONFIG_NET_PKT_RX_COUNT=8
CONFIG_NET_PKT_TX_COUNT=2
CONFIG_NET_BUF_RX_COUNT=12
CONFIG_NET_BUF_TX_COUNT=4
CONFIG_NET_BUF_DATA_SIZE=256
CONFIG_NET_CONFIG_AUTO_INIT=n

# The console carries the TAP hex stream; any log or banner text would
# corrupt it.
CONFIG_LOG=n
CONFIG_BOOT_BANNER=n

CONFIG_MAIN_STACK_SIZE=4096
