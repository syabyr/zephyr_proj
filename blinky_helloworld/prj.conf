# GPIO driver for the LED
CONFIG_GPIO=y

# Console / serial
CONFIG_SERIAL=y
CONFIG_CONSOLE=y
CONFIG_UART_CONSOLE=y

# Name threads (k_thread_name_set/get) and enumerate them (k_thread_foreach)
CONFIG_THREAD_NAME=y
CONFIG_THREAD_MONITOR=y

# Enable thread stack info so dump_thread() can print stack sizes
CONFIG_THREAD_STACK_INFO=y
